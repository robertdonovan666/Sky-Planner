name: Update comets

on:
  schedule:
    - cron: "17 11 * * *"   # daily, ~4 AM Pacific
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/update_comets.py
      - .github/workflows/comets.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/update_comets.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- comets.json; then echo "No change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898798+github-actions[bot]@users.noreply.github.com"
          git add comets.json
          git commit -m "Update comet elements"
          git push
